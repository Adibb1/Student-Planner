# Calls your planner every 5 minutes so push reminders can be sent on time.
# (Vercel's free plan only allows one cron run per day, so GitHub does the frequent checks.)
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   APP_URL      e.g. https://your-planner.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in your Vercel environment variables
name: Send planner reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/reminders"
